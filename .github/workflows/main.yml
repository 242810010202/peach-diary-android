
name: Build Peach Diary APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract project
        run: |
          mkdir -p project
          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Project ZIP not found"
            exit 1
          fi
          unzip -o "$ZIP_FILE" -d project
          test -f project/package.json

      - name: Install dependencies
        working-directory: project
        run: npm install && npm install -D typescript
      - name: Generate Android project
        working-directory: project
        run: npx cap add android

      - name: Sync web files
        working-directory: project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: project/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: peach-diary-apk
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
